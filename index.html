<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BIENVENIDOS</title>

  <style>
    body{
      margin:0;
      background:#111;
      font-family:Arial,sans-serif;
    }

    .container{
      width:100%;
      max-width:1200px;
      margin:auto;
      padding:20px;
    }

    .canva-frame{
      position:relative;
      width:100%;
      height:0;
      padding-top:146.1933%;
      overflow:hidden;
      border-radius:12px;
      box-shadow:0 2px 8px rgba(63,69,81,0.16);
    }

    .canva-frame iframe{
      position:absolute;
      width:100%;
      height:100%;
      top:0;
      left:0;
      border:none;
    }

    .link{
      text-align:center;
      margin-top:20px;
    }

    .link a{
      color:white;
      text-decoration:none;
      font-size:20px;
    }

    /* BOTON OCULTO */
    #playButton{
      position:fixed;
      inset:0;
      background:transparent;
      border:none;
      z-index:9999;
      cursor:pointer;
    }
  </style>
</head>

<body>

  <!-- AUDIO -->
  <audio id="bgmusic" loop>
    <source src="audio.mp3" type="audio/mpeg">
  </audio>

  <!-- BOTON INVISIBLE -->
  <button id="playButton"></button>

  <div class="container">

    <div class="canva-frame">
      <iframe 
        loading="lazy"
        src="https://www.canva.com/design/DAHK0Xn1YA8/Sn9yf8FpFZ7VocGHi-lQTQ/view?embed"
        allowfullscreen
        allow="fullscreen">
      </iframe>
    </div>

    <div class="link">
      <a href="https://www.canva.com/design/DAHK0Xn1YA8/Sn9yf8FpFZ7VocGHi-lQTQ/view?utm_content=DAHK0Xn1YA8&utm_campaign=designshare&utm_medium=embeds&utm_source=link"
      target="_blank">
        BIENVENIDOS
      </a>
    </div>

  </div>

  <script>
    const audio = document.getElementById("bgmusic");
    const btn = document.getElementById("playButton");

    audio.volume = 1.0;

    // Intento automático
    window.addEventListener("load", () => {
      audio.play().then(() => {
        btn.style.display = "none";
      }).catch(() => {
        console.log("Autoplay bloqueado");
      });
    });

    // Reproduce al primer toque/click
    btn.addEventListener("click", () => {
      audio.play();
      btn.style.display = "none";
    });
  </script>

</body>
</html>
