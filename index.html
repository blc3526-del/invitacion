<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bienvenidos</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#f2f2f2;
    font-family:Arial, sans-serif;

    display:flex;
    justify-content:center;

    min-height:100vh;
}

/* CONTENEDOR TIPO CELULAR */
.phone-container{

    width:100%;
    max-width:430px;

    background:white;

    min-height:100vh;

    overflow:hidden;
}

/* IFRAME RESPONSIVE */
.canva-wrapper{

    position:relative;

    width:100%;

    height:100vh;
}

.canva-wrapper iframe{

    position:absolute;

    top:0;
    left:0;

    width:100%;
    height:100%;

    border:none;
}

/* EN CELULARES */
@media(max-width:600px){

    .phone-container{
        max-width:100%;
    }

}

</style>
</head>

<body>

<div class="phone-container">

    <div class="canva-wrapper">

        <iframe
        loading="lazy"

        src="https://www.canva.com/design/DAHK0Xn1YA8/Sn9yf8FpFZ7VocGHi-lQTQ/view?embed"

        allowfullscreen
        allow="fullscreen">
        </iframe>

    </div>

</div>

</body>
</html>
